; Copy this file to mercuryio.ini beside mercuryio.dll, then set the real ports.
[controller]
touchPort=
ledPort=
; Release all touches and reconnect if fresh reports stop for this long.
touchTimeoutMs=100

[keyboard]
; Windows virtual-key codes. 0 disables a button.
test=0x70
service=0x71
coin=0x72
volup=0x26
voldown=0x28
